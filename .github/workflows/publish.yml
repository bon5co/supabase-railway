name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: db,       dockerfile: Dockerfile.db,       version: 17.6.1.136}
          - {name: auth,     dockerfile: Dockerfile.auth,     version: 2.196.0}
          - {name: rest,     dockerfile: Dockerfile.rest,     version: 14.17}
          - {name: realtime, dockerfile: Dockerfile.realtime, version: 2.134.10}
          - {name: storage,  dockerfile: Dockerfile.storage,  version: 1.74.0}
          - {name: meta,     dockerfile: Dockerfile.meta,     version: 0.99.0}
          - {name: studio,   dockerfile: Dockerfile.studio,   version: 2026.09.07}
          - {name: gateway,  dockerfile: Dockerfile.gateway,  version: caddy2}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          tags: |
            ghcr.io/bon5co/supabase-railway-${{ matrix.name }}:${{ matrix.version }}
            ghcr.io/bon5co/supabase-railway-${{ matrix.name }}:latest
